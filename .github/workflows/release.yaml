name: Release

on:
  push:
    tags:
      - 'v*'  # Triggered when you push a tag like v0.1.0

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            name: awsq-linux-amd64
          - goos: linux
            goarch: arm64
            name: awsq-linux-arm64
          - goos: darwin
            goarch: amd64
            name: awsq-darwin-amd64
          - goos: darwin
            goarch: arm64
            name: awsq-darwin-arm64
          - goos: windows
            goarch: amd64
            name: awsq-windows-amd64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go mod tidy
          go build -ldflags="-s -w" -o ${{ matrix.name }} .

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}
