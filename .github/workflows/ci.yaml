name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Verify module checksums
        run: go mod verify

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1

      - name: Build binaries
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          COMMIT=${GITHUB_SHA::7}
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          LDFLAGS="-s -w -X github.com/subashsasi/awsq/cmd.Version=${VERSION} -X github.com/subashsasi/awsq/cmd.CommitSHA=${COMMIT} -X github.com/subashsasi/awsq/cmd.BuildDate=${DATE}"
          GOOS=linux GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o awsq-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -ldflags="${LDFLAGS}" -o awsq-windows-amd64.exe .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: awsq-binaries
          path: |
            awsq-linux-amd64
            awsq-windows-amd64.exe
