name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Download dependencies
        run: go mod tidy

      - name: Build
        run: go build -v ./...

      - name: Run tests
        run: go test -v ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Verify module checksums
        run: go mod verify

      - name: Vulnerability scan
        uses: golang/govulncheck-action@v1

      - name: Build binary
        run: GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o awsq-linux-amd64 .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: awsq-linux-amd64
          path: awsq-linux-amd64
